name: Validate host platforms

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      android_build:
        description: Build and verify private test APKs on Linux; do not upload them
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Audit source before generating any private files
        run: python3 -B scripts/privacy-audit.py . --ignore-git
      - name: Shell syntax
        shell: bash
        run: |
          for file in ./*.sh; do bash -n "$file"; done
      - name: Web dependencies, tests and production build
        run: |
          npm --prefix panel ci --no-fund --no-audit
          npm --prefix panel test
          npm --prefix panel run build
      - name: Python unit tests
        run: |
          python3 -B -m unittest discover -s tests
          python3 -B -m unittest discover -s hardware/tests

  windows-syntax:
    name: Windows PowerShell syntax (WSL runtime not exercised)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Parse PowerShell launchers
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path . -Recurse -Filter '*.ps1' -File)
          if ($files.Count -eq 0) { throw 'No PowerShell launcher found.' }
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw "PowerShell parse failure: $($file.Name)" }
          }
          Write-Host "Parsed $($files.Count) PowerShell files. WSL networking and installation require a Windows machine."
      - name: Reject invalid launcher inputs before any WSL call
        shell: pwsh
        run: |
          $cases = @(
            @{ Action = 'invalid'; ProjectPath = '/home/fixture/KT_TABLE_TV' },
            @{ Action = 'start'; ProjectPath = 'relative/path' },
            @{ Action = 'start'; ProjectPath = '/mnt/c/KT_TABLE_TV' },
            @{ Action = 'start'; ProjectPath = '/home/fixture/../KT_TABLE_TV' },
            @{ Action = 'start'; ProjectPath = '/home/fixture/KT_TABLE_TV'; Distribution = 'Ubuntu;unexpected' }
          )
          foreach ($case in $cases) {
            $rejected = $false
            try { & ./Home-Panel.ps1 @case } catch { $rejected = $true }
            if (-not $rejected) { throw 'Invalid launcher input was accepted.' }
          }
          Write-Host 'Invalid action, path and distribution inputs rejected.'

  android-linux:
    name: Linux Android build and signature verification
    if: github.event_name == 'workflow_dispatch' && inputs.android_build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required packages into the runner's existing Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/licenses"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-22' 'build-tools;35.0.0' 'ndk;29.0.14206865' </dev/null
          printf 'ANDROID_NDK_HOME=%s/ndk/29.0.14206865\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Fresh synthetic setup, Android tests and API 22 signatures
        run: python3 -B tests/ci_android_smoke.py
